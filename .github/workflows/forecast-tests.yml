name: Forecast checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_standalone_notebook.py
      - run: git diff --exit-code -- october_forecast_standalone.ipynb
      - run: python tools/check_standalone_notebook.py
